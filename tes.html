<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Dinamis</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#fff5f8;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:500px;
      background:white;
      padding:35px;
      border-radius:25px;
      box-shadow:0 10px 40px rgba(0,0,0,0.1);
      text-align:center;
    }

    h1{
      color:#ff4f81;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:15px;
      border:2px solid #ffd6e3;
      border-radius:12px;
      outline:none;
      font-size:16px;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#ff4f81;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ff2f6d;
    }

    #qrcode{
      margin-top:30px;
    }

    .total{
      margin-top:20px;
      font-size:22px;
      color:#ff4f81;
      font-weight:bold;
    }

  </style>
</head>
<body>

  <div class="box">

    <h1>QRIS Dinamis Daisymphony</h1>

    <input type="number" id="amount" placeholder="Masukkan nominal pembayaran">

    <button onclick="generateQRIS()">
      Buat QRIS
    </button>

    <div class="total" id="show-total"></div>

    <div id="qrcode"></div>

  </div>


  <script>

    // QRIS ORIGINAL KAMU
    const qrisData = `00020101021126570011ID.DANA.WWW011893600915354846259702095484625970303UMI51440014ID.CO.QRIS.WWW0215ID10233009415570303UMI5204561153033605802ID5911Daisymphony 6015Kota Yogyakarta6105551126304B2AA`;


    function toCRC16(input) {

      let crc = 0xFFFF;

      for (let i = 0; i < input.length; i++) {

        crc ^= input.charCodeAt(i) << 8;

        for (let j = 0; j < 8; j++) {

          if ((crc & 0x8000) !== 0) {
            crc = (crc << 1) ^ 0x1021;
          } else {
            crc <<= 1;
          }

          crc &= 0xFFFF;
        }
      }

      return crc.toString(16).toUpperCase().padStart(4, '0');
    }


    function makeDynamicQRIS(qris, amount){

      // ubah static jadi dynamic
      qris = qris.replace("010211", "010212");

      let amountTag = "54" + amount.length.toString().padStart(2,'0') + amount;

      let withoutCRC = qris.slice(0, -4);

      // hapus tag nominal lama jika ada
      withoutCRC = withoutCRC.replace(/54\d{2}\d+/g, '');

      let finalData = withoutCRC + amountTag + "6304";

      let crc = toCRC16(finalData);

      return finalData + crc;
    }


    function generateQRIS(){

      const amount = document.getElementById("amount").value;

      if(!amount || amount <= 0){
        alert("Masukkan nominal dulu 😭");
        return;
      }

      const qrisDinamis = makeDynamicQRIS(qrisData, amount);

      document.getElementById("qrcode").innerHTML = "";

      QRCode.toCanvas(qrisDinamis, {
        width:300
      }, function(err, canvas){

        if(err){
          console.log(err);
          return;
        }

        document.getElementById("qrcode").appendChild(canvas);
      });

      document.getElementById("show-total").innerHTML =
        "Total: Rp " + Number(amount).toLocaleString('id-ID');
    }

  </script>

</body>
</html>
